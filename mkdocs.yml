site_name: IBM Bob — EY Lab Guide
site_description: Hands-on lab guide for the IBM Bob Bobathon at EY — three tracks for Beginner, Intermediate, and Expert participants.
site_url: https://marcdecker.github.io/EY

theme:
  name: material
  logo: assets/Bob_icon_sm.png
  favicon: assets/Bob_icon_sm.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/css/mermaid-theme.css

plugins:
  - search
  - glightbox

nav:
  - Home: index.md
  - 🟢 Beginner:
    - labs/EY-beginner.md
  - 🟡 Intermediate:
    - labs/EY-intermediate.md
  - 🔴 Expert:
    - labs/EY-expert.md
  - 🏆 Challenge:
    - labs/EY-challenge.md
